<h2>Find an Author</h2>
<form (ngSubmit)="onSubmit()" class="row g-2 align-items-end mb-3">
  <div class="col-auto">
    <label for="authorId" class="form-label">Author id:</label>
    <input type="number" min="1" id="authorId" name="authorId" class="form-control"
           [(ngModel)]="authorId" required>
  </div>
  <div class="col-auto">
    <button type="submit" class="btn btn-primary">Search</button>
  </div>
</form>

@if (message) {
  <div class="alert alert-warning" role="alert">{{ message }}</div>
}

@if (author) {
  <div class="card">
    <div class="card-body">
      <h4 class="card-title">{{ author.firstName }} {{ author.lastName }}</h4>
      <p><b>Id:</b> {{ author.id }}</p>
      <p><b>Books:</b></p>
      <ul>
        @for (book of author.books; track book.id) {
          <li>{{ book.title }}</li>
        } @empty {
          <li>No books recorded for this author.</li>
        }
      </ul>
    </div>
  </div>
}
